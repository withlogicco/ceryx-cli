name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: >-
          docker buildx build
          --platform darwin/arm64,darwin/amd64,linux/arm64,linux/amd64
          --build-arg VERSION="${TAG#v}"
          --output dist .
        env:
          TAG: ${{ github.event.release.tag_name }}
      # Raw binaries named ceryx_<os>_<arch>: github.com/marcosnils/bin picks the asset
      # by OS/arch in the name and strips them to install it as "ceryx". It skips .txt.
      - name: Upload
        run: |
          mkdir assets
          for f in dist/*/ceryx; do cp "$f" "assets/ceryx_$(basename "$(dirname "$f")")"; done
          (cd assets && sha256sum ceryx_* > checksums.txt)
          gh release upload "$TAG" assets/* --clobber
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
